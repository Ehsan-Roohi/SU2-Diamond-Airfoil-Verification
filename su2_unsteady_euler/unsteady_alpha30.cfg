% Mach-3 sharp diamond, alpha=30 deg, time-accurate fine-wake Euler run
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
READ_BINARY_RESTART= NO
SOLUTION_FILENAME= restart_startup

MACH_NUMBER= 3.0
AOA= 30.0
FREESTREAM_TEMPERATURE= 300.0

REF_ORIGIN_MOMENT_X= 0.5
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 1.0
REF_DIMENSIONALIZATION= FREESTREAM_PRESS_EQ_ONE

MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= 2.0E-6
TIME_ITER= 4000
MAX_TIME= 1.0
INNER_ITER= 30

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
NUM_METHOD_GRAD_RECON= WEIGHTED_LEAST_SQUARES
MGLEVEL= 3
CFL_NUMBER= 1.0
CFL_ADAPT= NO

VENKAT_LIMITER_COEFF= 0.03
LIMITER_ITER= 999999
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-8
LINEAR_SOLVER_ITER= 25

CONV_NUM_METHOD_FLOW= HLLC
MUSCL_FLOW= YES
MUSCL_KAPPA_FLOW= 0.5
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
ENTROPY_FIX_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT

CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -6
CONV_STARTITER= 5
CONV_CAUCHY_ELEMS= 20
CONV_CAUCHY_EPS= 1E-7

MESH_FILENAME= mesh/diamond_euler_sharp_wakefine_1440x721.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
CONV_FILENAME= history_unsteady
RESTART_FILENAME= restart_unsteady
VOLUME_FILENAME= flow_unsteady
SURFACE_FILENAME= surface_unsteady

SCREEN_WRT_FREQ_INNER= 10
SCREEN_WRT_FREQ_TIME= 1
HISTORY_WRT_FREQ_INNER= 30
HISTORY_WRT_FREQ_TIME= 1
OUTPUT_WRT_FREQ= 90, 90, 90
WRT_RESTART_COMPACT= YES
WRT_RESTART_OVERWRITE= NO
WRT_VOLUME_OVERWRITE= NO
WRT_SURFACE_OVERWRITE= NO
OUTPUT_FILES= (RESTART_ASCII, PARAVIEW, SURFACE_CSV)
VOLUME_OUTPUT= (COORDINATES, SOLUTION, PRIMITIVE)
SCREEN_OUTPUT= (TIME_ITER, INNER_ITER, RMS_DENSITY, RMS_ENERGY, LIFT, DRAG)
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF, AERO_COEFF_SURF)
