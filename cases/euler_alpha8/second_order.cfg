% Chapter 6 student case: Mach-3 diamond airfoil
% Model=EULER, alpha=8 deg, stage=second_order
% SU2 v8.5.0; r_LE/c=0.001; far field approximately 20c
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
READ_BINARY_RESTART= NO

MACH_NUMBER= 3.0
AOA= 8.0
FREESTREAM_TEMPERATURE= 300.0

REF_ORIGIN_MOMENT_X= 0.5
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 1.0
REF_DIMENSIONALIZATION= FREESTREAM_PRESS_EQ_ONE

MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
NUM_METHOD_GRAD_RECON= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.2
CFL_ADAPT= NO
% Teaching continuation is folded into one 2000-iteration second-order stage.
ITER= 2000

VENKAT_LIMITER_COEFF= 0.03
LIMITER_ITER= 999999
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-8
LINEAR_SOLVER_ITER= 20

CONV_NUM_METHOD_FLOW= HLLC
MUSCL_FLOW= YES
MUSCL_KAPPA_FLOW= 0.5
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
ENTROPY_FIX_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT

CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 20
CONV_CAUCHY_ELEMS= 200
CONV_CAUCHY_EPS= 1E-7

MESH_FILENAME= ../../meshes/diamond_euler_sharp_medium_720x181.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= restart_startup
TABULAR_FORMAT= CSV
CONV_FILENAME= history_second_order
RESTART_FILENAME= restart_second_order
VOLUME_FILENAME= flow_second_order
SURFACE_FILENAME= surface_flow_second_order
SCREEN_WRT_FREQ_INNER= 50
OUTPUT_WRT_FREQ= 250
OUTPUT_FILES= (RESTART_ASCII, PARAVIEW, SURFACE_PARAVIEW, SURFACE_CSV)
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, LIFT, DRAG)
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF, AERO_COEFF_SURF)
