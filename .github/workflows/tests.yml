name: Repository tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.26,<2" "pillow>=10" "pytest>=8"
      - name: Run core tests that do not require SU2
        run: python -m unittest discover -s tests -v
      - name: Run DART pilot static and physics-gate tests
        run: python -m pytest -q research/dart_cfd_pilot/tests
