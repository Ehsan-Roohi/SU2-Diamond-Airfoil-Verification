name: v3 shock-conditioned analytic benchmark

on:
  pull_request:
    paths:
      - 'research/dart_cfd_pilot/**'
      - '.github/workflows/v3-shock-conditioned-analytic.yml'
  workflow_dispatch:

jobs:
  analytic-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.17.1 matplotlib==3.10.8 pytest==8.4.2
      - name: Run v3 analytic benchmark
        run: |
          mkdir -p v3-artifacts
          python research/dart_cfd_pilot/scripts/run_vortex_analytic_v3_shock_conditioned.py \
            --output-dir v3-artifacts | tee v3-artifacts/run.log
      - name: Upload physical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-shock-conditioned-analytic
          path: v3-artifacts/
          if-no-files-found: error
